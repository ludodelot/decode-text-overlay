<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Inputs and outputs of decode-text-overlay"><title>Inputs and outputs of decode-text-overlay</title><style>.m{font-family:"Space Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;visibility:hidden}.s{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:"Space Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}</style><rect width="1200" height="520" rx="18" fill="#0f0b12"/><text class="s" x="36" y="52" font-size="24" font-weight="700" fill="#f4eae6">One input, six outputs</text><text class="s" x="36" y="80" font-size="15" fill="#8f8498">Same animation everywhere. Python renders files, JavaScript renders the browser version.</text><rect x="36" y="130" width="290" height="84" rx="12" fill="#1a131f" stroke="#33283b"/><text class="s" x="58" y="164" font-size="17" font-weight="600" fill="#f4eae6">Phrases</text><text class="mono" x="58" y="190" font-size="13" fill="#e9aaa0">-t "EVEREST\n8,849 M"</text><path d="M326 172 C400 172 400 305.0 470 305.0" fill="none" stroke="#e9aaa0" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="36" y="240" width="290" height="84" rx="12" fill="#1a131f" stroke="#33283b"/><text class="s" x="58" y="274" font-size="17" font-weight="600" fill="#f4eae6">Photo or video</text><text class="mono" x="58" y="300" font-size="13" fill="#e9aaa0">--bg photo.jpg</text><path d="M326 282 C400 282 400 305.0 470 305.0" fill="none" stroke="#e9aaa0" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="36" y="350" width="290" height="84" rx="12" fill="#1a131f" stroke="#33283b"/><text class="s" x="58" y="384" font-size="17" font-weight="600" fill="#f4eae6">Style</text><text class="mono" x="58" y="410" font-size="13" fill="#e9aaa0">--size  --tracking  --color</text><path d="M326 392 C400 392 400 305.0 470 305.0" fill="none" stroke="#e9aaa0" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="470" y="240" width="260" height="130" rx="16" fill="#2a1a2f" stroke="#e9aaa0" stroke-width="1.5"/><text class="s" x="600.0" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="#f4eae6">decode-text-overlay</text><text class="mono" x="600.0" y="324" text-anchor="middle" font-size="12.5" fill="#8f8498">decode_overlay.py + ffmpeg</text><rect x="470" y="240" width="260" height="130" rx="16" fill="none" stroke="#e9aaa0" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.4s" repeatCount="indefinite"/></rect><path d="M730 305.0 C810 305.0 790 138 800 138" fill="none" stroke="#9fd8c0" stroke-opacity=".65" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="800" y="112" width="364" height="52" rx="10" fill="#1a131f" stroke="#33283b"/><text class="mono" x="820" y="135" font-size="15" font-weight="700" fill="#f4eae6">story.mp4</text><text class="s" x="820" y="154" font-size="12.5" fill="#8f8498">text burned onto photo/video</text><path d="M730 305.0 C810 305.0 790 200 800 200" fill="none" stroke="#9fd8c0" stroke-opacity=".65" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="800" y="174" width="364" height="52" rx="10" fill="#1a131f" stroke="#33283b"/><text class="mono" x="820" y="197" font-size="15" font-weight="700" fill="#f4eae6">overlay.mov / .webm</text><text class="s" x="820" y="216" font-size="12.5" fill="#8f8498">transparent layer (alpha)</text><path d="M730 305.0 C810 305.0 790 262 800 262" fill="none" stroke="#9fd8c0" stroke-opacity=".65" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="800" y="236" width="364" height="52" rx="10" fill="#1a131f" stroke="#33283b"/><text class="mono" x="820" y="259" font-size="15" font-weight="700" fill="#f4eae6">text.gif</text><text class="s" x="820" y="278" font-size="12.5" fill="#8f8498">looping GIF</text><path d="M730 305.0 C810 305.0 790 324 800 324" fill="none" stroke="#9fd8c0" stroke-opacity=".65" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="800" y="298" width="364" height="52" rx="10" fill="#1a131f" stroke="#33283b"/><text class="mono" x="820" y="321" font-size="15" font-weight="700" fill="#f4eae6">text.svg</text><text class="s" x="820" y="340" font-size="12.5" fill="#8f8498">animated SVG, no JS</text><path d="M730 305.0 C810 305.0 790 386 800 386" fill="none" stroke="#9fd8c0" stroke-opacity=".65" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="800" y="360" width="364" height="52" rx="10" fill="#1a131f" stroke="#33283b"/><text class="mono" x="820" y="383" font-size="15" font-weight="700" fill="#f4eae6">frames/</text><text class="s" x="820" y="402" font-size="12.5" fill="#8f8498">PNG sequence</text><path d="M730 305.0 C810 305.0 790 448 800 448" fill="none" stroke="#9fd8c0" stroke-opacity=".65" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="800" y="422" width="364" height="52" rx="10" fill="#1a131f" stroke="#33283b"/><text class="mono" x="820" y="445" font-size="15" font-weight="700" fill="#f4eae6">&lt;decode-text&gt;</text><text class="s" x="820" y="464" font-size="12.5" fill="#8f8498">web component</text></svg>