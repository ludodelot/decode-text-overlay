<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Using decode-text-overlay with Claude Code and Codex"><title>Using decode-text-overlay with Claude Code and Codex</title><style>.m{font-family:"Space Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;visibility:hidden}.s{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:"Space Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}</style><rect width="1200" height="470" rx="18" fill="#0f0b12"/><text class="s" x="36" y="52" font-size="24" font-weight="700" fill="#f4eae6">Ask your agent in plain language</text><text class="s" x="36" y="80" font-size="15" fill="#8f8498">Claude Code loads the skill. Codex follows AGENTS.md. Both call the same script.</text><g transform="translate(36,0)"><rect y="104" width="560" height="330" rx="14" fill="#0b080e" stroke="#33283b"/><rect y="104" width="560" height="38" rx="14" fill="#1a131f"/><rect y="124" width="560" height="18" fill="#1a131f"/><circle cx="24" cy="123" r="6" fill="#ff5f57"/><circle cx="44" cy="123" r="6" fill="#febc2e"/><circle cx="64" cy="123" r="6" fill="#28c840"/><text class="mono" x="280.0" y="128" text-anchor="middle" font-size="13" fill="#e9aaa0">Claude Code</text><text class="mono" x="24" y="176" font-size="13.5" fill="#f4eae6" opacity="0" xml:space="preserve">&gt; put "EVEREST 8,849 M" over ridge.jpg as a decoding text<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.0000;1" values="0;1;1"/></text><text class="mono" x="24" y="216" font-size="13.5" fill="#8f8498" opacity="0" xml:space="preserve">● decode-text-overlay skill loaded<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.1667;1" values="0;1;1"/></text><text class="mono" x="24" y="256" font-size="13.5" fill="#8f8498" opacity="0" xml:space="preserve">● decode_overlay.py -t "EVEREST\n8,849 M" --bg ridge.jpg<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.3333;1" values="0;1;1"/></text><text class="mono" x="24" y="296" font-size="13.5" fill="#8f8498" opacity="0" xml:space="preserve">●       --preset cinematic --color auto -o ridge_text.mp4<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.5000;1" values="0;1;1"/></text><text class="mono" x="24" y="336" font-size="13.5" fill="#9fd8c0" opacity="0" xml:space="preserve">✓ 138 frames, 4.6s -&gt; ridge_text.mp4<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.6667;1" values="0;1;1"/></text><rect x="24" y="362" width="9" height="16" fill="#e9aaa0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g><g transform="translate(604,0)"><rect y="104" width="560" height="330" rx="14" fill="#0b080e" stroke="#33283b"/><rect y="104" width="560" height="38" rx="14" fill="#1a131f"/><rect y="124" width="560" height="18" fill="#1a131f"/><circle cx="24" cy="123" r="6" fill="#ff5f57"/><circle cx="44" cy="123" r="6" fill="#febc2e"/><circle cx="64" cy="123" r="6" fill="#28c840"/><text class="mono" x="280.0" y="128" text-anchor="middle" font-size="13" fill="#9fd8c0">Codex CLI</text><text class="mono" x="24" y="176" font-size="13.5" fill="#f4eae6" opacity="0" xml:space="preserve">&gt; add a decode text layer with K2, 8,611 M to ridge.jpg<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.0000;1" values="0;1;1"/></text><text class="mono" x="24" y="216" font-size="13.5" fill="#8f8498" opacity="0" xml:space="preserve">● reads AGENTS.md in the repo<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.1667;1" values="0;1;1"/></text><text class="mono" x="24" y="256" font-size="13.5" fill="#8f8498" opacity="0" xml:space="preserve">● decode_overlay.py -t "K2\n8,611 M" --bg ridge.jpg<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.3333;1" values="0;1;1"/></text><text class="mono" x="24" y="296" font-size="13.5" fill="#8f8498" opacity="0" xml:space="preserve">●       --preset cinematic --color auto -o ridge_text.mp4<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.5000;1" values="0;1;1"/></text><text class="mono" x="24" y="336" font-size="13.5" fill="#9fd8c0" opacity="0" xml:space="preserve">✓ 138 frames, 4.6s -&gt; ridge_text.mp4<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.6667;1" values="0;1;1"/></text><rect x="24" y="362" width="9" height="16" fill="#9fd8c0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g></svg>