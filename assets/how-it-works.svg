<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How the decode effect works"><title>How the decode effect works</title><style>.m{font-family:"Space Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;visibility:hidden}.s{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:"Space Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}</style><rect width="1200" height="470" rx="18" fill="#0f0b12"/><text class="s" x="36" y="52" font-size="24" font-weight="700" fill="#f4eae6">How the effect works</text><text class="s" x="36" y="80" font-size="15" fill="#8f8498">Every character gets its own appear time and resolve time. Frames below are real output of the renderer.</text><g opacity=".35"><animate attributeName="opacity" calcMode="discrete" dur="9.0s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1" values="1;.35;.35;.35;.35;.35"/><rect x="36" y="112" width="210" height="220" rx="14" fill="#1a131f" stroke="#33283b"/><circle cx="64" cy="142" r="13" fill="#e9aaa0"/><text class="s" x="64" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#0f0b12">1</text><text class="s" x="88" y="147" font-size="14.5" font-weight="600" fill="#f4eae6">Start at the center</text><text class="mono" xml:space="preserve" x="143.0" y="236" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">    L   </text><text class="mono" xml:space="preserve" x="143.0" y="266" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">   &gt;D   </text></g><g opacity=".35"><animate attributeName="opacity" calcMode="discrete" dur="9.0s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1" values=".35;1;.35;.35;.35;.35"/><rect x="268" y="112" width="210" height="220" rx="14" fill="#1a131f" stroke="#33283b"/><circle cx="296" cy="142" r="13" fill="#e9aaa0"/><text class="s" x="296" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#0f0b12">2</text><text class="s" x="320" y="147" font-size="14.5" font-weight="600" fill="#f4eae6">Grow outward</text><text class="mono" xml:space="preserve" x="375.0" y="236" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">  QH_C  </text><text class="mono" xml:space="preserve" x="375.0" y="266" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">  &lt;JDN  </text></g><g opacity=".35"><animate attributeName="opacity" calcMode="discrete" dur="9.0s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1" values=".35;.35;1;.35;.35;.35"/><rect x="500" y="112" width="210" height="220" rx="14" fill="#1a131f" stroke="#33283b"/><circle cx="528" cy="142" r="13" fill="#e9aaa0"/><text class="s" x="528" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#0f0b12">3</text><text class="s" x="552" y="147" font-size="14.5" font-weight="600" fill="#f4eae6">Glyphs keep changing</text><text class="mono" xml:space="preserve" x="607.0" y="236" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre"> AN&lt;&lt;C*$</text><text class="mono" xml:space="preserve" x="607.0" y="266" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">TYASX1¡ </text></g><g opacity=".35"><animate attributeName="opacity" calcMode="discrete" dur="9.0s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1" values=".35;.35;.35;1;.35;.35"/><rect x="732" y="112" width="210" height="220" rx="14" fill="#1a131f" stroke="#33283b"/><circle cx="760" cy="142" r="13" fill="#e9aaa0"/><text class="s" x="760" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#0f0b12">4</text><text class="s" x="784" y="147" font-size="14.5" font-weight="600" fill="#f4eae6">Resolve in random order</text><text class="mono" xml:space="preserve" x="839.0" y="236" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">MJD&amp;84HM</text><text class="mono" xml:space="preserve" x="839.0" y="266" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">IZSSS4N=</text></g><g opacity=".35"><animate attributeName="opacity" calcMode="discrete" dur="9.0s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1" values=".35;.35;.35;.35;1;1"/><rect x="964" y="112" width="210" height="220" rx="14" fill="#1a131f" stroke="#33283b"/><circle cx="992" cy="142" r="13" fill="#e9aaa0"/><text class="s" x="992" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#0f0b12">5</text><text class="s" x="1016" y="147" font-size="14.5" font-weight="600" fill="#f4eae6">Hold, then cut to next</text><text class="mono" xml:space="preserve" x="1071.0" y="236" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">MIDNIGHT</text><text class="mono" xml:space="preserve" x="1071.0" y="266" text-anchor="middle" font-size="22" letter-spacing=".16em" fill="#f4eae6" style="white-space:pre">SESSIONS</text></g><rect x="36" y="362" width="1138" height="6" rx="3" fill="#33283b"/><rect x="36" y="362" width="0" height="6" rx="3" fill="#e9aaa0"><animate attributeName="width" values="0;1138" dur="9.0s" repeatCount="indefinite"/></rect><circle cy="365" r="9" fill="#f4eae6"><animate attributeName="cx" values="36;1174" dur="9.0s" repeatCount="indefinite"/></circle><text class="s" x="36" y="404" font-size="14" fill="#8f8498">0 s</text><text class="s" x="1174" y="404" text-anchor="end" font-size="14" fill="#8f8498">--decode seconds (default 0.9) + --hold (default 1.3)</text><text class="mono" x="36" y="432" font-size="13.5" fill="#e9aaa0">appear  = grow × distance_from_center × jitter</text><text class="mono" x="36" y="452" font-size="13.5" fill="#e9aaa0">resolve = decode × (0.35 + 0.65 × random)</text></svg>