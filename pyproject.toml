[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decode-text-overlay"
version = "0.3.0"
description = "Decoding monospace text layers for photos, videos and the web (CLI, Claude Code skill, web component)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ludovic Delot" }]
keywords = ["text-animation", "overlay", "video", "gif", "svg", "claude-code", "skill"]
dependencies = ["pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/ludodelot/decode-text-overlay"
Demo = "https://ludodelot.github.io/decode-text-overlay/web/demo.html"

[project.scripts]
decode-text-overlay = "decode_overlay:main"

[tool.setuptools]
package-dir = { "" = "skills/decode-text-overlay/scripts" }
py-modules = ["decode_overlay"]

[tool.setuptools.data-files]
"share/decode-text-overlay/fonts" = ["skills/decode-text-overlay/fonts/SpaceMono-Regular.ttf", "skills/decode-text-overlay/fonts/OFL.txt"]
